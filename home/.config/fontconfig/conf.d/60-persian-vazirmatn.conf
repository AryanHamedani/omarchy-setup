<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- System fonts: Inter for interface/web text, JetBrains Mono (Omarchy's font) for code,
     Vazirmatn for every Persian/Arabic letter. Kept outside fonts.conf, which
     `omarchy font set` rewrites; runs after Omarchy's 50-omarchy.conf. -->
<fontconfig>
  <!-- Omarchy maps sans-serif and system-ui to Liberation Sans: put Inter in front
       (Liberation Sans stays as the fallback) and Persian right after. -->
  <match target="pattern">
    <test name="family" qual="any"><string>Liberation Sans</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Inter</string></edit>
    <edit name="family" mode="append" binding="strong"><string>Vazirmatn</string></edit>
  </match>

  <!-- Persian right after the code font too, so it never falls to another Arabic font. -->
  <match target="pattern">
    <test name="family" qual="first"><string>JetBrainsMono Nerd Font</string></test>
    <edit name="family" mode="append" binding="strong"><string>Vazirmatn</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>fa</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Vazirmatn</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>ar</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Vazirmatn</string></edit>
  </match>
  <!-- Last resort for apps that look up one character at a time (Chromium, Electron). -->
  <match target="pattern">
    <edit name="family" mode="append" binding="strong"><string>Vazirmatn</string></edit>
  </match>

  <!-- Noto's Arabic fonts are calligraphic book faces; without them every fallback
       for Persian letters lands on Vazirmatn. -->
  <selectfont>
    <rejectfont>
      <pattern><patelt name="family"><string>Noto Naskh Arabic</string></patelt></pattern>
      <pattern><patelt name="family"><string>Noto Naskh Arabic UI</string></patelt></pattern>
      <pattern><patelt name="family"><string>Noto Sans Arabic</string></patelt></pattern>
      <pattern><patelt name="family"><string>Noto Sans Arabic UI</string></patelt></pattern>
      <!-- Only standard Vazirmatn; skip its RD/FD/NL/UI variant families. -->
      <glob>/usr/share/fonts/vazirmatn/Vazirmatn-RD-*</glob>
      <glob>/usr/share/fonts/vazirmatn/Vazirmatn-FD-*</glob>
      <glob>/usr/share/fonts/vazirmatn/Vazirmatn-NL-*</glob>
      <glob>/usr/share/fonts/vazirmatn/Vazirmatn-UI-*</glob>
    </rejectfont>
  </selectfont>
</fontconfig>
